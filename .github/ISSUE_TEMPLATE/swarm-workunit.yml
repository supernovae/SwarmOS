name: SwarmOS Work Unit
description: Define a contract-driven work unit for SwarmOS agents and contributors
title: "[Swarm] "
labels: ["swarm:draft"]
body:
  - type: input
    id: base_branch
    attributes:
      label: Base Branch
      description: Optional target branch. Inherits the repository setting, or its default branch.
    validations:
      required: false
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Clear, single-purpose statement of what needs to be achieved. If the best approach is still an open question, say so and the plan will start with a small probe.
      placeholder: Implement ...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Architectural, dependency, or scope boundaries, including anything you already know must stay true (one bullet per line).
      placeholder: |
        - No new external dependencies
        - Maintain backward compatibility
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Testable conditions required for completion (one bullet per line).
      placeholder: |
        - [ ] Unit tests cover edge cases
        - [ ] `swarm issue validate` passes
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      description: Select a prompt recipe for the fixed SwarmOS phase engine.
      options:
        - feature
        - bugfix
        - refactor
      default: 0
    validations:
      required: true
  - type: dropdown
    id: plan_gate
    attributes:
      label: Plan Gate
      description: Requested review gate; repository policy may require a stricter gate. A maintainer must approve this task before claiming.
      options:
        - agent
        - human
        - none
      default: 0
    validations:
      required: true
