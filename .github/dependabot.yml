version: 2
updates:
  # One weekly PR for Go minor and patch updates; each major upgrade stays
  # separate because those are the ones likely to need code changes.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]

  # One weekly PR for all GitHub Actions updates. These edit a protected path,
  # so review the new pins before merging (see docs/backlog.md).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns: ["*"]
