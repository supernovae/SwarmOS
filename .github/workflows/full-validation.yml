name: Full validation

on:
  workflow_call:
    inputs:
      commit:
        description: Immutable commit to validate
        required: true
        type: string
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: Formatting and static checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Static checks
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.commit || github.sha }}'
          make lint changelog-check
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  tests:
    name: Race tests (${{ matrix.shard }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [cli-a, cli-b, cli-c, cli-d, workflow-a, workflow-b, state, storage, other]
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Configure test identity
        run: |
          git config --global user.name "SwarmOS CI"
          git config --global user.email "ci@swarmos.local"
      - name: Install reviewer sandbox
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      # Race tests also run every ordinary test. The two large packages get
      # separate runners; complementary filters cover all their top-level tests.
      - name: Test shard
        env:
          SHARD: ${{ matrix.shard }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$(git rev-parse HEAD)" = '${{ inputs.commit || github.sha }}'
          case "$SHARD" in
            cli-a) packages=(./internal/cli); filter='^TestC' ;;
            cli-b) packages=(./internal/cli); filter='^TestI' ;;
            cli-c) packages=(./internal/cli); filter='^Test[A-BD-HJ-M]' ;;
            cli-d) packages=(./internal/cli); filter='^Test([^A-M]|$)|^Example|^Fuzz' ;;
            workflow-a) packages=(./internal/workflow); filter='^Test[A-M]' ;;
            workflow-b) packages=(./internal/workflow); filter='^Test([^A-M]|$)|^Example|^Fuzz' ;;
            state) packages=(./internal/coordination ./internal/lease ./internal/pr); filter=. ;;
            storage) packages=(./internal/storage ./internal/validation); filter=. ;;
            other)
              all_packages=$(go list ./...)
              mapfile -t packages < <(printf '%s\n' "$all_packages" | grep -Ev '/internal/(cli|workflow|coordination|lease|pr|storage|validation)$')
              test "${#packages[@]}" -gt 0
              filter=.
              ;;
            *) exit 1 ;;
          esac
          # Large capacity fixtures run nightly. Releases retain every API,
          # fencing, isolation, deadline and cleanup regression test.
          skip='^(TestReclamationInventoryRealLedgerScale|TestMaintenanceRealShapeScaleAndEvidenceBudget)$'
          if [ "$EVENT_NAME" = schedule ]; then skip='^$'; fi
          set -o pipefail
          go test -race -json -timeout=20m -p=2 -parallel=8 -run "$filter" -skip "$skip" "${packages[@]}" | tee "$RUNNER_TEMP/tests.jsonl"
      - name: Retain test timings and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.shard }}-${{ inputs.commit || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tests.jsonl
          retention-days: 14
