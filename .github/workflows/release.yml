name: Release binaries
run-name: Release ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to preflight (created only inside the build runner)
        required: true
        default: v0.10.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
      preflight: ${{ steps.preflight.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and verify release commit
        id: commit
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH with an optional prerelease suffix.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Find successful preflight for this exact commit
        if: github.event_name == 'push'
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.commit.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/actions/workflows/release.yml/runs?head_sha=$RELEASE_SHA&event=workflow_dispatch&status=success&per_page=30" > "$RUNNER_TEMP/preflights.json"
          run=$(python3 scripts/release-preflight.py "$RUNNER_TEMP/preflights.json" "$RELEASE_SHA" "$DEFAULT_BRANCH" "$RELEASE_TAG")
          echo "run=$run" >> "$GITHUB_OUTPUT"

  checks:
    if: needs.resolve.outputs.preflight == ''
    needs: resolve
    uses: ./.github/workflows/full-validation.yml
    with:
      commit: ${{ needs.resolve.outputs.commit }}
    permissions:
      contents: read

  # Build the real versioned archives immediately, alongside tests. A manual
  # preflight uses a local tag and cannot create a GitHub tag or release.
  package:
    if: needs.resolve.outputs.preflight == ''
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Prepare exact release version and notes
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          text = Path('CHANGELOG.md').read_text()
          marker = f'## {tag}\n'
          assert text.count(marker) == 1, f'Missing changelog section for {tag}'
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(text.split(marker, 1)[1].split('\n## ', 1)[0].strip() + '\n')
          PY
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --skip=publish --parallelism=2 --timeout=10m --release-notes=${{ runner.temp }}/release-notes.md
      - name: Verify all release archives
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.commit }}
        run: python3 scripts/verify-release.py dist "$RELEASE_TAG" "$RELEASE_SHA"
      - name: Stage verified assets
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets/dist"
          cp dist/*.tar.gz dist/*.zip dist/*_checksums.txt "$RUNNER_TEMP/release-assets/dist/"
          cp "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-assets/"
      - name: Retain exact assets for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ needs.resolve.outputs.tag }}-${{ needs.resolve.outputs.commit }}
          path: ${{ runner.temp }}/release-assets/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  publish:
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.resolve.result == 'success' && (needs.resolve.outputs.preflight != '' || (needs.checks.result == 'success' && needs.package.result == 'success'))
    needs: [resolve, checks, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified archives
        if: needs.resolve.outputs.preflight == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets-${{ needs.resolve.outputs.tag }}-${{ needs.resolve.outputs.commit }}
          path: release
      - name: Download archives from successful preflight
        if: needs.resolve.outputs.preflight != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets-${{ needs.resolve.outputs.tag }}-${{ needs.resolve.outputs.commit }}
          path: release
          run-id: ${{ needs.resolve.outputs.preflight }}
          github-token: ${{ github.token }}
      - name: Verify checksums
        working-directory: release/dist
        run: sha256sum --check --strict *_checksums.txt
      # Keep the release mutable until every asset and attestation is attached.
      - name: Create draft with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SHA: ${{ needs.resolve.outputs.commit }}
        run: |
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          if existing=$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish); then
            # An interrupted upload can resume the same unpublished version.
            echo "$existing" | jq -e --arg sha "$RELEASE_SHA" '.isDraft and .targetCommitish == $sha'
            gh release upload "$RELEASE_TAG" release/dist/* --clobber
          else
            gh release create "$RELEASE_TAG" release/dist/* --verify-tag --draft \
              --target "$RELEASE_SHA" --title "$RELEASE_TAG" --notes-file release/release-notes.md
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release/dist/*.tar.gz
            release/dist/*.zip
            release/dist/*_checksums.txt
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
