name: SwarmOS CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test-matrix:
    name: Test and CLI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 26.04 ships the AppArmor policy needed for bwrap user/network namespaces.
        # Windows and macOS tests are paused while the suite is too slow there
        # (#105); their binaries are still cross-compiled below. Re-add
        # macos-latest, or windows-latest with a non-race test step, to bring
        # them back.
        os: [ubuntu-26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Configure test identity
        run: |
          git config --global user.name "SwarmOS CI"
          git config --global user.email "ci@swarmos.local"
      - name: Install reviewer sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Regression tests
        # internal/cli runs serially (its fixtures use t.Setenv) and takes up to
        # ~10m on macOS runners, so the default per-package limit is too tight.
        run: go test -race -timeout 15m ./...
      - name: Build CLI
        run: go build -o swarm-ci.exe ./cmd/swarm
      - name: Exercise CLI surface
        run: |
          ./swarm-ci.exe version
          ./swarm-ci.exe --help
          ./swarm-ci.exe repo --help
          ./swarm-ci.exe repo init --help
          ./swarm-ci.exe repo doctor --help
          ./swarm-ci.exe repo plan --help
          ./swarm-ci.exe repo validate --help
          ./swarm-ci.exe issue --help
          ./swarm-ci.exe issue claim --help
          ./swarm-ci.exe issue work --help
          ./swarm-ci.exe issue stage --help
          ./swarm-ci.exe issue review-plan --help
          ./swarm-ci.exe issue validate --help
          ./swarm-ci.exe issue submit --help
          ./swarm-ci.exe pr --help
          ./swarm-ci.exe pr status --help
          ./swarm-ci.exe pr work --help
          ./swarm-ci.exe pr stage --help
          ./swarm-ci.exe pr rebase --help
          ./swarm-ci.exe pr validate --help
          ./swarm-ci.exe pr submit --help
      - name: Cross-compile all distributions
        if: runner.os == 'Linux'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/swarm
          done

  policy:
    name: SwarmOS policy validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Same rule as the shipped template: maintainers' own branches list
      # protected changes; agent branches, forks, and other authors are enforced.
      - name: Decide protected-path handling
        id: protected
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          mode=enforce
          issue=
          case "$HEAD_REF" in
            swarm/*)
              # A same-repository issue branch names the issue whose approved
              # state the trusted validator checks. The name grants nothing.
              if [ "$HEAD_REPO" = "$REPO" ]; then
                case "$HEAD_REF" in
                  swarm/issue-[0-9]*-*) issue=${HEAD_REF#swarm/issue-}; issue=${issue%%-*} ;;
                esac
                case "$issue" in *[!0-9]*) issue= ;; esac
              fi
              ;;
            *)
              if [ "$HEAD_REPO" = "$REPO" ]; then
                permission=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || true)
                case "$permission" in admin|maintain|write) mode=report ;; esac
              fi
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
      # Build the validator from the trusted base so a pull request never
      # chooses the code that judges it.
      - name: Build validator from the trusted base
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          BASE_SHA=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" = pull_request ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            BASE_SHA=$(git rev-parse HEAD^1)
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/trusted" "$BASE_SHA"
          (cd "$RUNNER_TEMP/trusted" && go build -o "$RUNNER_TEMP/swarm-bin/swarm" ./cmd/swarm)
      # This step holds a token, so it runs only the trusted validator, never
      # candidate code: it checks the linked issue's authoritative approved
      # state and records the verified grant for the validate step.
      - name: Verify approved harness grant
        if: steps.protected.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LINKED_ISSUE: ${{ steps.protected.outputs.issue }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          swarm="$RUNNER_TEMP/swarm-bin/swarm"
          grant="$RUNNER_TEMP/swarm-harness-grant.json"
          rm -f "$grant"
          if ! "$swarm" repo validate --help | grep -q -- '--grant-only'; then
            echo "::notice::The validator at the trusted base predates approved harness grants; protected paths stay enforced."
            exit 0
          fi
          if ! git rev-parse -q --verify HEAD^2 >/dev/null; then
            exit 0
          fi
          "$swarm" repo validate --base "$(git rev-parse HEAD^1)" --issue "$LINKED_ISSUE" --pr "$PR_NUMBER" --grant-only --grant-file "$grant"
      - name: Validate against trusted base
        env:
          PROTECTED_MODE: ${{ steps.protected.outputs.mode || 'enforce' }}
        run: |
          swarm="$RUNNER_TEMP/swarm-bin/swarm"
          if ! "$swarm" repo validate --help | grep -q -- '--protected-paths'; then
            echo "::notice::The validator at the trusted base predates protected-path reporting; this check starts with the next pull request."
            exit 0
          fi
          set --
          if [ -f "$RUNNER_TEMP/swarm-harness-grant.json" ]; then
            set -- --grant-file "$RUNNER_TEMP/swarm-harness-grant.json"
          fi
          status=0
          "$swarm" repo validate --base "$BASE_SHA" --protected-paths "$PROTECTED_MODE" "$@" > "$RUNNER_TEMP/swarm-validate.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/swarm-validate.txt"
          { echo '### SwarmOS validation'; echo '```text'; cat "$RUNNER_TEMP/swarm-validate.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
