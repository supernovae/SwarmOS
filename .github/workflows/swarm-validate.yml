name: SwarmOS CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test-matrix:
    name: Test and CLI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 26.04 ships the AppArmor policy needed for bwrap user/network namespaces.
        os: [ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Configure test identity
        run: |
          git config --global user.name "SwarmOS CI"
          git config --global user.email "ci@swarmos.local"
      - name: Install reviewer sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Unix regression tests
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Windows regression tests
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Build CLI
        run: go build -o swarm-ci.exe ./cmd/swarm
      - name: Exercise CLI surface
        run: |
          ./swarm-ci.exe version
          ./swarm-ci.exe --help
          ./swarm-ci.exe work --help
      - name: Cross-compile all distributions
        if: runner.os == 'Linux'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/swarm
          done
