version: 1
# Native isolation: qualified Codex releases on Linux. Run swarm repo doctor before work.
default_agent: codex
plan_mode: auto
execution:
  mode: isolated
  backend: native
default_gate: agent
# Plan reviews come from a different harness than the one that wrote the plan.
roles:
  reviewer: claude
lease:
  duration: 4h
  renewable: true
  max_renewals: 3
security:
  require_ready_label: true
  ready_label: "swarm:ready"
# First matching execution profile supplies prompts and evidence expectations.
profiles:
  - name: urgent
    match: {risk: urgent}
    prompt_variant: urgent
    evidence: ["Smallest mitigation first; file root cause as a follow-up."]
  - name: investigation
    match: {uncertainty: unknown}
    prompt_variant: investigation
    evidence: ["Run a bounded investigation with a reversible probe and record a decision artifact."]
  - name: sensitive
    match: {risk: sensitive}
    prompt_variant: sensitive
    evidence: ["Keep the plan compact; require strong independent review and adversarial test cases."]
  - name: detailed
    match: {size: multi_area}
    prompt_variant: detailed
    evidence: ["Write a detailed handoff covering area boundaries, dependencies and validation evidence."]
  - name: compact
    match: {size: small}
    prompt_variant: compact
    evidence: ["Keep planning and evidence concise, with focused verification of each acceptance criterion."]
agents:
  # Optional harnesses: native isolation qualification is still in progress.
  claude:
    binary: claude
  codex:
    binary: codex
  opencode:
    binary: opencode
  omp:
    binary: omp
