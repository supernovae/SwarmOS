required_checks:
    - name: build
      command: go build ./...
      timeout: 5m
    - name: test
      command: go test ./...
      timeout: 10m
    - name: lint
      command: go vet ./...
      timeout: 5m
protected_paths:
    - .github/workflows/**
    - .swarm/validation/**
    - .swarm/contracts/**
    - .swarm/config.yaml
    - .swarm/prompts/**
    - .swarm/workflows/**
    - .swarm/goals.md
    - .swarm/SKILLS.md
    - .swarm/rules/**
    - .swarm/skills/**
    - .swarm/project.md
    - .swarm/architecture.md
    - .swarm/conventions.md
    - .claude/commands/**
    - .opencode/commands/**
    - AGENTS.md
    - CLAUDE.md
