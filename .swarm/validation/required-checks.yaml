required_checks:
    - name: fmt
      command: 'unformatted=$(gofmt -s -l .); if [ -n "$unformatted" ]; then printf "%s\n" "$unformatted"; exit 1; fi'
      timeout: 2m
    - name: build
      command: go build ./...
      timeout: 5m
    - name: lint
      command: go vet ./...
      timeout: 5m
    - name: staticcheck
      command: go tool staticcheck ./...
      timeout: 5m
    - name: test
      command: go test ./...
      timeout: 10m
protected_paths:
    - .github/workflows/**
    - .swarm/validation/**
    - .swarm/contracts/**
    - .swarm/config.yaml
    - .swarm/prompts/**
    - .swarm/workflows/**
    - .swarm/goals.md
    - .swarm/SKILLS.md
    - .swarm/rules/**
    - .swarm/skills/**
    - .swarm/project.md
    - .swarm/architecture.md
    - .swarm/conventions.md
    - .claude/commands/**
    - .opencode/commands/**
    - AGENTS.md
    - CLAUDE.md
