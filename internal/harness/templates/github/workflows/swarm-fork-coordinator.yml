name: SwarmOS Fork Coordinator

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: swarm-fork-coordinator-${{ github.repository }}-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  coordinate:
    if: github.event.issue.pull_request == null && startsWith(github.event.comment.body, '<!-- swarm:fork-request:v1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install pinned SwarmOS coordinator
        env:
          SWARM_VERSION: SWARM_VERSION_PIN
          GOBIN: ${{ runner.temp }}/swarm-bin
        working-directory: ${{ runner.temp }}
        run: |
          go install github.com/supernovae/swarmos/cmd/swarm@"$SWARM_VERSION"
      - name: Execute fork worker request against upstream state refs
        env:
          SWARM_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWARM_REPO: ${{ github.repository }}
        run: |
          "$RUNNER_TEMP/swarm-bin/swarm" fork-coordinator --event "$GITHUB_EVENT_PATH"
