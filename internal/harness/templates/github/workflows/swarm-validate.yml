name: SwarmOS Validation
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Run Go Tests
        run: go test -race ./...
      - name: Build and Run Swarm Validate
        run: |
          go build -o /tmp/swarm ./cmd/swarm
          /tmp/swarm validate --ci
