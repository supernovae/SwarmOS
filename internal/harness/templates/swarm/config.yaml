# Optional target branch; inherited by WorkUnits without an override.
# base_branch: release/1.x
version: 1
# Linux isolation: Codex native sandbox; other harnesses use isolated tools.
# Run swarm repo doctor before work. Models are optional; each harness chooses its default.
default_agent: codex
default_gate: agent
plan_mode: auto
# Checkpoint commit messages: concise (default) or detailed.
commit_message:
  detail: concise
# Ledger refs: hidden keeps state under refs/swarm/* (out of the branch list,
# not protectable by rulesets); branch keeps refs/heads/swarm-* (the default
# when omitted). Only the upstream default branch's value is used.
ledger_namespace: hidden
execution:
  mode: isolated
  backend: native
lease:
  duration: 4h
  renewable: true
  max_renewals: 3
security:
  require_ready_label: true
  ready_label: "swarm:ready"
# First matching execution profile supplies prompts and evidence expectations.
profiles:
  - name: urgent
    match: {risk: urgent}
    prompt_variant: urgent
    evidence: ["Smallest mitigation first; file root cause as a follow-up."]
  - name: investigation
    match: {uncertainty: unknown}
    prompt_variant: investigation
    evidence: ["Run a bounded investigation with a reversible probe and record a decision artifact."]
  - name: sensitive
    match: {risk: sensitive}
    prompt_variant: sensitive
    evidence: ["Keep the plan compact; require strong independent review and adversarial test cases."]
  - name: detailed
    match: {size: multi_area}
    prompt_variant: detailed
    evidence: ["Write a detailed handoff covering area boundaries, dependencies and validation evidence."]
  - name: compact
    match: {size: small}
    prompt_variant: compact
    evidence: ["Keep planning and evidence concise, with focused verification of each acceptance criterion."]
agents:
  # Route roles to installed harnesses. OpenCode requires V2 (2.1.2 or newer).
  # Claude/OpenCode/OhMyPi isolated tools require Bubblewrap and Python 3.
  claude:
    binary: claude
  codex:
    binary: codex
  opencode:
    binary: opencode
  omp:
    binary: omp
