version: 1
default_agent: codex
default_gate: agent
plan_mode: auto
execution:
  mode: isolated
  backend: native
lease:
  duration: 4h
  renewable: true
  max_renewals: 3
security:
  require_ready_label: true
  ready_label: "swarm:ready"
agents:
  claude:
    binary: claude
  codex:
    binary: codex
  opencode:
    binary: opencode
  omp:
    binary: omp
